name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (GCC, all tests)
    runs-on: ubuntu-latest
    # The distribution AIEdit is developed on: its Qt 6.10 and KF6 packages cover every
    # optional dependency.
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build g++ \
            qt6-base-dev qt6-l10n-tools libkf6syntaxhighlighting-dev libuchardet-dev \
            pkg-config libcapstone-dev \
            fonts-dejavu-core fonts-noto-cjk
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC, build only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          cache: true
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release --parallel
