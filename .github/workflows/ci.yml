name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (GCC, all tests)
    runs-on: ubuntu-latest
    # The distribution AIEdit is developed on: its Qt 6.10 and KF6 packages cover every
    # optional dependency.
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build g++ \
            qt6-base-dev qt6-l10n-tools libkf6syntaxhighlighting-dev libuchardet-dev \
            pkg-config libcapstone-dev \
            fonts-dejavu-core fonts-noto-cjk
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC, all tests, installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      # KSyntaxHighlighting, uchardet and Capstone: built once and kept, also when a later step
      # fails, until the script changes.
      - name: Restore the libraries
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}\aiedit-deps
          key: windows-deps-qt6.10-${{ hashFiles('packaging/windows/build-deps.ps1') }}
      - name: Build the libraries
        if: steps.deps.outputs.cache-hit != 'true'
        run: >-
          packaging/windows/build-deps.ps1 -Qt "$env:QT_ROOT_DIR" -Prefix "$env:RUNNER_TEMP\aiedit-deps"
          -WorkDir "$env:RUNNER_TEMP\aiedit-deps-src"
      - name: Keep the libraries
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}\aiedit-deps
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR;$env:RUNNER_TEMP\aiedit-deps"
      - name: Build
        run: cmake --build build
      - name: Test
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:RUNNER_TEMP\aiedit-deps\bin;$env:PATH"
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE -eq 0) {
            Select-String -Path build\test-logs\tst_codec.txt -Pattern 'code pages' | Out-Host
            exit 0
          }
          # What ctest did not show: each failed test's own log, then the test once more, to
          # tell a failure from a flaky one.
          $env:QT_QPA_PLATFORM = 'offscreen'
          foreach ($line in Get-Content build\Testing\Temporary\LastTestsFailed.log) {
            $name = ($line -split ':')[1]
            Write-Host "===== $name"
            Get-Content "build\test-logs\$name.txt" -ErrorAction SilentlyContinue |
              Select-String -NotMatch '^(PASS|QDEBUG|QINFO)|propagateSizeHints' | Out-Host
            $program = (Get-ChildItem build -Recurse -Filter "$name.exe" | Select-Object -First 1).FullName
            & $program -o "$env:RUNNER_TEMP\$name.txt,txt"
            Write-Host ("===== {0} again: exit code {1}" -f $name, $LASTEXITCODE)
          }
          exit 1
      # The colour schemes on a real Windows screen, title bar and Windows 11 style included, to
      # look at; not a test that can fail the build.
      - name: Screenshots
        continue-on-error: true
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:RUNNER_TEMP\aiedit-deps\bin;$env:PATH"
          $env:AIEDIT_SCREENSHOT_DIR = "$PWD\screenshots"
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $program = (Get-ChildItem build -Recurse -Filter tst_colorscheme.exe | Select-Object -First 1).FullName
          & $program rendersTheSchemes
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-windows
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore
      - name: Package
        run: packaging/windows/package.ps1 -Build build -Output dist
      # The packed folder runs on its own: with only Windows on PATH, aiedit.exe is still running
      # after five seconds (a missing DLL ends it at once).
      - name: Start the packed program
        run: |
          if (-not (Test-Path dist\AIEdit\bin\KF6SyntaxHighlighting.dll)) { throw 'KSyntaxHighlighting is missing' }
          if (Test-Path dist\AIEdit\bin\icuuc.dll) { throw "Windows' icuuc.dll was copied into the package" }
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $program = Start-Process dist\AIEdit\bin\aiedit.exe -ArgumentList '--new-window', "$PWD\README.md" -PassThru
          Start-Sleep -Seconds 5
          if ($program.HasExited) { throw "aiedit.exe ended with exit code $($program.ExitCode)" }
          Stop-Process -Id $program.Id
      # Installs for the current user, checks what it registered, and uninstalls again.
      - name: Install and uninstall
        run: |
          $setup = (Get-ChildItem dist\*-setup.exe).FullName
          $target = "$env:RUNNER_TEMP\AIEdit-installed"
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$target" -Wait
          if (-not (Test-Path "$target\bin\aiedit.exe")) { throw 'aiedit.exe was not installed' }
          $menu = (Get-ItemProperty -LiteralPath 'HKCU:\Software\Classes\*\shell\AIEdit\command').'(default)'
          if ($menu -ne "`"$target\bin\aiedit.exe`" `"%1`"") { throw "Right-click menu: $menu" }
          if ($null -eq (Get-ItemProperty -LiteralPath 'HKCU:\Software\Classes\.log\OpenWithProgids').'AIEdit.File') { throw 'Not in Open with for .log' }
          if (-not (Get-ItemProperty -LiteralPath 'HKCU:\Software\RegisteredApplications').AIEdit) { throw 'Not in Default apps' }
          Start-Process "$target\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          if (Test-Path -LiteralPath 'HKCU:\Software\Classes\*\shell\AIEdit') { throw 'The right-click menu is still there' }
          $left = Get-ItemProperty -LiteralPath 'HKCU:\Software\Classes\.log\OpenWithProgids' -ErrorAction SilentlyContinue
          if ($left -and $null -ne $left.'AIEdit.File') { throw '.log still lists AIEdit' }
          if (Test-Path "$target\bin\aiedit.exe") { throw 'aiedit.exe is still installed' }
      - uses: actions/upload-artifact@v7
        with:
          name: AIEdit-windows-x64
          path: |
            dist/*-setup.exe
            dist/*.zip
          retention-days: 30
